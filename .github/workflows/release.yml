name: Release

# Publishes the GitHub release for the package.json version, using the matching
# docs/release-X.Y.Z.md guide as release notes. Pushing a vX.Y.Z tag runs it for
# that tag; running it by hand on the default branch tags the current commit.
# Re-running for an existing release is a no-op.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish the release guide as release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag ${REF_NAME} does not match the package.json version ${version}."
            exit 1
          fi
          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Run releases from ${DEFAULT_BRANCH}, not ${REF_NAME}."
            exit 1
          fi
          notes="docs/release-${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing ${notes}; add the release guide before releasing ${tag}."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to publish."
            exit 0
          fi
          subtitle="$(head -n 1 "$notes" | sed -E 's/^# (Build [0-9.]+ — )?//')"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "STRATA ${version} — ${subtitle}" \
            --notes-file "$notes"
