name: iOS app

# Builds the Capacitor iOS shell in mobile/ for the iOS simulator without signing, launches it, and keeps
# screenshots. It runs only when the app's own files change, or by hand, because macOS runners are slower than
# Linux ones. Shipping to TestFlight is a separate, signed step described in docs/ios-app.md.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Build and launch in the iOS simulator
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Use the newest installed Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install the app's tooling
        run: npm ci

      - name: Copy the web shell and config into the Xcode project
        run: npx cap sync ios

      - name: Build for the simulator without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch in a simulator and take screenshots
        run: |
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in runtimes if "iOS" in k), key=lambda k: [int(n) for n in re.findall(r"\d+", k)])
          for runtime in reversed(ios):
              phones = [d for d in runtimes[runtime] if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
              phones = phones or [d for d in runtimes[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')"
          test -n "$device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist"
          xcrun simctl install "$device" "$app"
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun simctl launch "$device" online.stratafitness.app
          sleep 4
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/screens/1-launch.png"
          sleep 26
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/screens/2-home.png"
          # The app must still be running: a crash at launch would leave the simulator on the home screen.
          xcrun simctl spawn "$device" launchctl list | grep -q "online.stratafitness.app"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

      - name: Print small previews for reviewers without artifact access
        if: always()
        run: |
          for shot in "$RUNNER_TEMP"/screens/*.png; do
            [ -f "$shot" ] || continue
            sips -Z 640 -s format jpeg -s formatOptions 55 "$shot" --out "${shot%.png}.jpg" >/dev/null
            echo "::group::preview $(basename "${shot%.png}")"
            echo "PREVIEW-BEGIN $(basename "${shot%.png}")"
            base64 -i "${shot%.png}.jpg" | fold -w 4000
            echo "PREVIEW-END"
            echo "::endgroup::"
          done
