services:
  - type: web
    name: strata-workout-index
    runtime: node
    # Always-on baseline; verify capacity against the real Turso region before launch.
    plan: 1c-2g
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: APP_BASE_URL
        value: https://stratafitness.online
      - key: ADMIN_EMAIL
        value: stratafitness.official@gmail.com
      - key: SUPPORT_EMAIL
        value: stratafitness.official@gmail.com
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: STRATA <accounts@auth.stratafitness.online>
      - key: EMAIL_REPLY_TO
        value: stratafitness.official@gmail.com
      - key: EMAIL_VERIFICATION_SECRET
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: live
      - key: PADDLE_PRODUCT_ID
        sync: false
      - key: PADDLE_PRICE_ID
        sync: false
      - key: PADDLE_LEGACY_RECURRING_PRICE_IDS
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_CHECKOUT_ENABLED
        sync: false
      - key: PADDLE_ENFORCE_IP_ALLOWLIST
        value: "false"
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
