services:
  - type: web
    name: strata-workout-index
    runtime: node
    # Always-on baseline; verify capacity against the real Turso region before launch.
    plan: 1c-2g
    # STRATA runs as exactly one server (see docs/deployment.md, "One server"). A second server logs
    # service.multiple_instances; scale up with a bigger plan, not more instances.
    numInstances: 1
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: SECURE_COOKIES
        value: "true"
      - key: APP_BASE_URL
        value: https://stratafitness.online
      - key: ADMIN_EMAIL
        value: stratafitness.official@gmail.com
      - key: SUPPORT_EMAIL
        value: stratafitness.official@gmail.com
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: EMAIL_VERIFICATION_ENABLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: STRATA <accounts@auth.stratafitness.online>
      - key: EMAIL_REPLY_TO
        value: stratafitness.official@gmail.com
      - key: EMAIL_VERIFICATION_SECRET
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: live
      - key: PADDLE_PRODUCT_ID
        sync: false
      - key: PADDLE_PRICE_ID
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_CHECKOUT_ENABLED
        sync: false
      - key: PADDLE_ENFORCE_IP_ALLOWLIST
        value: "false"
      - key: APPLE_BUNDLE_ID
        value: online.stratafitness.app
      - key: APPLE_IAP_PRODUCT_IDS
        value: online.stratafitness.app.plus.monthly
      - key: APPLE_SANDBOX_ACCOUNTS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRATA_AI_MODEL
        sync: false
      - key: STRATA_AI_FALLBACK_MODEL
        sync: false
      - key: POLAR_CLIENT_ID
        sync: false
      - key: POLAR_CLIENT_SECRET
        sync: false
      - key: DEVICE_TOKEN_KEY
        sync: false
      - key: DEVICE_TOKEN_KEY_PREVIOUS
        sync: false
      - key: GOOGLE_SIGN_IN_CLIENT_ID
        sync: false
      - key: GOOGLE_SIGN_IN_CLIENT_SECRET
        sync: false
